[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-edit-mcp"
version = "0.0.1"
description = "MCP server for RADx data dictionaries: validate, query, author"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
dependencies = [
    # Same toolkit the app's sidecar consumes, pinned to the same released tag
    # so the MCP and the app agree on parsing/validation behaviour. Bump
    # deliberately, in step with sidecar/pyproject.toml.
    "dd-api @ git+https://github.com/bmir-radx/radx-data-dictionary-specification.git@v0.0.7#subdirectory=api",
    "dd-validate @ git+https://github.com/bmir-radx/radx-data-dictionary-specification.git@v0.0.7#subdirectory=validator",
    "mcp>=1.2",
    "pyyaml",  # format sniffing
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
dd-edit-mcp = "dd_edit_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dd_edit_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
