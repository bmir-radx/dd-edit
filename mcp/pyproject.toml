[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-edit-mcp"
version = "0.0.1"
description = "MCP server for RADx data dictionaries: validate, query, author"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
dependencies = [
    # The shared core carries the pinned dd-* toolkit (and format sniffing), so
    # the MCP and the app agree on parsing/validation behaviour from one place.
    "dd-edit-core",
    "mcp>=1.2",
]

# Local path to the shared core for development installs. A published build
# would depend on a released dd-edit-core instead.
[tool.uv.sources]
dd-edit-core = { path = "../core", editable = true }

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
dd-edit-mcp = "dd_edit_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dd_edit_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
