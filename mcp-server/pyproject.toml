[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-edit-mcp"
version = "0.0.1"
description = "MCP server for RADx data dictionaries: validate, query, author"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
dependencies = [
    # The shared core carries the pinned dd-* toolkit (and format sniffing), so
    # the MCP and the app agree on parsing/validation behaviour from one place.
    #
    # A direct reference (PEP 508) rather than a bare name, because dd-edit-core
    # is not published: a bare name sends pip to PyPI, where it 404s. uv resolved
    # it anyway via [tool.uv.sources] below, which is why this only ever broke
    # under pip — in CI, and under `pipx run` with its default backend.
    "dd-edit-core @ git+https://github.com/bmir-radx/dd-edit.git#subdirectory=core",
    # The REDCap converter, beyond what the shared core carries. Pinned to the
    # same released tag as the sidecar so both convert identically.
    "dd-redcap @ git+https://github.com/bmir-radx/radx-data-dictionary-specification.git@v0.0.7#subdirectory=redcap",
    # Bounded to the 2.x major: 2.0 moved the server class (FastMCP ->
    # mcpserver.MCPServer) and dropped the in-memory test helper, so an
    # unbounded ">=" would break the imports again on the next major.
    "mcp>=2,<3",
]

# For development, override the git reference above with the working tree, so
# edits to core/ take effect without a commit-and-push cycle. uv honours this;
# pip ignores it and uses the direct reference, which is why that has to be a
# real URL rather than a bare name.
[tool.uv.sources]
dd-edit-core = { path = "../core", editable = true }

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
dd-edit-mcp = "dd_edit_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dd_edit_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default run stays offline and deterministic: the one test that really hits
# OLS4 is opt-in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: needs network access (real ontology lookup)"]
