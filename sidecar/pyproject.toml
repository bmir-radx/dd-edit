[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-edit-sidecar"
version = "0.0.1"
description = "Stateless HTTP sidecar for dd-edit: dd-json in, conversions/findings/HTML out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
dependencies = [
    # Shared detect/load/validate core (carries dd-api + dd-validate, pinned).
    #
    # A direct reference (PEP 508) rather than a bare name: dd-edit-core is not
    # published, so a bare name sends pip to PyPI, where it 404s. Only uv reads
    # the [tool.uv.sources] override below, which is why this has to be a real
    # URL for every other installer.
    #
    # The release workflow still installs ../core *before* this, and must keep
    # doing so — not to satisfy the dependency (this URL would) but because the
    # build has to freeze the core being built rather than whatever is on the
    # default branch. pip leaves an already-installed dd-edit-core alone, so that
    # ordering wins; it also has to be a regular install, since PyInstaller
    # cannot follow an editable install's import-hook shim.
    "dd-edit-core @ git+https://github.com/bmir-radx/dd-edit.git#subdirectory=core",
    # Toolkit pieces the sidecar uses directly beyond the shared core, pinned to
    # the same released tag so the app ships against a known-good build.
    "dd-printer @ git+https://github.com/bmir-radx/radx-data-dictionary-specification.git@v0.0.7#subdirectory=printer",
    "dd-redcap @ git+https://github.com/bmir-radx/radx-data-dictionary-specification.git@v0.0.7#subdirectory=redcap",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# For development, override the git reference above with the working tree, so
# edits to core/ take effect without a commit-and-push cycle. uv honours this;
# pip ignores it and uses the direct reference.
[tool.uv.sources]
dd-edit-core = { path = "../core", editable = true }

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]  # httpx: FastAPI TestClient
build = ["pyinstaller>=6"]  # one-dir binary bundled into the packaged app

[tool.setuptools.packages.find]
where = ["."]
include = ["dd_edit_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
